<script>
const sb=supabase.createClient(CFG.url,CFG.key),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

const eur=n=>Number(n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const dd=s=>s?new Date(String(s).slice(0,10)+'T12:00').toLocaleDateString('it-IT'):'—';

const oggi=()=>new Date().toLocaleDateString('sv-SE');

const csv=(nome,righe)=>{const cell=c=>{let s=String(c??'');if(/^[=+\-@\t\r]/.test(s)&&!/^-?\d+([.,]\d+)?$/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
 const b=new Blob(['﻿'+righe.map(r=>r.map(cell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};

let P=null,S={},tab='cruscotto';

/* ---------- finestra di modifica generica ---------- */
const modal=(tit,campi,val,salva,btn='Salva')=>{
 const m=document.createElement('div');m.className='mo';
 m.innerHTML=`<form class="card" novalidate><h2 style="margin-top:0">${esc(tit)}</h2><div class="fg">${campi.map(c=>`<div class="${c.w==2?'f2':''}"><label for="mf_${c.k}">${esc(c.l)}${c.r?' *':''}</label>${c.t=='select'?`<select id="mf_${c.k}">${c.o.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select>`:c.t=='textarea'?`<textarea id="mf_${c.k}" rows="3"></textarea>`:`<input id="mf_${c.k}" type="${c.t||'text'}" ${c.t=='number'?'step="0.01"':''}>`}</div>`).join('')}</div><p class="msg" id="mf_err"></p><div class="row" style="justify-content:flex-end"><button type="button" class="btn t" id="mf_no">Annulla</button><button class="btn" type="submit" style="margin-top:0">${esc(btn)}</button></div></form>`;
 document.body.appendChild(m);
 campi.forEach(c=>{m.querySelector('#mf_'+c.k).value=val&&val[c.k]!=null?val[c.k]:(c.d??'')});
 const chiudi=()=>{m.remove();document.removeEventListener('keydown',esc2)},esc2=e=>{if(e.key=='Escape')chiudi()};
 document.addEventListener('keydown',esc2);
 m.onclick=e=>{if(e.target==m)chiudi()};m.querySelector('#mf_no').onclick=chiudi;
 const f0=m.querySelector('input,select,textarea');if(f0)f0.focus();
 m.querySelector('form').onsubmit=async e=>{e.preventDefault();const o={};
  for(const c of campi){const el=m.querySelector('#mf_'+c.k),v=el.value.trim();
   if(c.r&&!v){m.querySelector('#mf_err').textContent='Compila: '+c.l;el.focus();return}
   o[c.k]=c.t=='number'?(v===''?null:fl(v)):(v||null)}
  const b=m.querySelector('button[type=submit]');b.disabled=true;
  const err=await salva(o);b.disabled=false;
  if(err){m.querySelector('#mf_err').textContent=err;return}chiudi()}};
const chips=(lista,cur,onSel)=>{const d=document.createElement('div');d.className='top';d.style.margin='0 0 14px';
 d.innerHTML=lista.map(x=>`<button type="button" class="${x[0]==cur?'on':''}" data-c="${x[0]}">${esc(x[1])}</button>`).join('');
 d.onclick=e=>{const b=e.target.closest('[data-c]');if(b)onSel(b.dataset.c)};return d};

/* ---------- avvio ---------- */
const boot=async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)return location.replace('index.html');
 const{data}=await sb.from('profili').select('*').eq('id',session.user.id).maybeSingle();
 if(!data||!data.contabile||!data.attivo){$('#app').innerHTML='<h1>Accesso riservato</h1><p class="sub">Quest\'area è riservata al personale contabile. Se pensi sia un errore, chiedi alle Risorse Umane.</p><a class="btn" href="index.html">Torna all\'app</a>';return}
 P=data;const{data:s}=await sb.from('azienda_fiscale').select('*').maybeSingle();S=s||{};show()};

const show=()=>{$('#nav').innerHTML=menuHtml();return run(()=>V[tab]())};
const go=t=>{tab=t;scrollTo(0,0);return show()};

/* ---------- Cruscotto ---------- */
const V={};
V.cruscotto=async()=>{const t=oggi(),y=t.slice(0,4);
 const[fa,us,co]=await Promise.all([q(sb.from('fatture').select('id,numero,anno,totale,pagato,scadenza,imponibile,data_emissione,stato_doc,clienti(ragione_sociale)').neq('stato_doc','annullata')),q(sb.from('uscite').select('*,fornitori(ragione_sociale)')),q(sb.from('saldi_conti').select('*'))]);
 const em=fa.filter(f=>f.stato_doc=='emessa'),bo=fa.filter(f=>f.stato_doc=='bozza');
 const aperteF=em.filter(f=>res(f)>0),aperteU=us.filter(u=>res(u)>0);
 const sum=(a,fn)=>r2(a.reduce((s,x)=>s+fn(x),0));
 const disp=sum(co,c=>+c.saldo),inc=sum(aperteF,res),scF=aperteF.filter(f=>f.scadenza&&f.scadenza<t),pag=sum(aperteU,res),scU=aperteU.filter(u=>u.scadenza&&u.scadenza<t);
 const fatt=sum(em.filter(f=>f.data_emissione.startsWith(y)),f=>+f.imponibile);
 const prox=[...aperteF.map(f=>({t:'Incasso',d:'Fattura '+f.numero+'/'+f.anno,c:f.clienti?.ragione_sociale,s:f.scadenza,r:res(f)})),...aperteU.map(u=>({t:'Pagamento',d:u.descrizione,c:u.fornitori?.ragione_sociale,s:u.scadenza,r:res(u)}))].sort((a,b)=>(a.s||'9999').localeCompare(b.s||'9999')).slice(0,6);
 $('#app').innerHTML=`<h1>Cruscotto</h1><p class="sub">${esc(S.ragione_sociale||'La tua azienda')} · situazione al ${dd(t)}</p>
<div class="kp"><div class="card"><small>Disponibilità</small><b class="${disp<0?'neg':''}">${eur(disp)}</b><span class="sub" style="margin:0">${co.length} conti</span></div>
<div class="card"><small>Da incassare</small><b>${eur(inc)}</b><span class="sub ${scF.length?'neg':''}" style="margin:0">${scF.length?scF.length+' scadute per '+eur(sum(scF,res)):'Nessun ritardo'}</span></div>
<div class="card"><small>Da pagare</small><b>${eur(pag)}</b><span class="sub ${scU.length?'neg':''}" style="margin:0">${scU.length?scU.length+' scadute per '+eur(sum(scU,res)):'Nessun ritardo'}</span></div>
<div class="card"><small>Fatturato ${y} (imponibile)</small><b>${eur(fatt)}</b><span class="sub" style="margin:0">${bo.length} bozze da completare</span></div></div>
<div class="tb2"><button class="btn" id="nf">Nuova fattura</button><button class="btn t" id="nu">Registra una spesa</button><button class="btn t" id="ns">Vedi scadenze</button></div>
<h2>Prossime scadenze</h2>${tbl(['Tipo','Documento','Controparte','Scadenza','>Residuo'],prox.map(x=>`<tr><td>${x.t}</td><td>${esc(x.d)}</td><td>${esc(x.c||'—')}</td><td class="${x.s&&x.s<t?'neg':''}">${dd(x.s)}</td><td class="n">${eur(x.r)}</td></tr>`).join(''))}`;
 $('#nf').onclick=()=>run(()=>V.fe());$('#nu').onclick=async()=>{await go('uscite');uscitaModal()};$('#ns').onclick=()=>go('scadenze')};

/* ---------- Fatture: elenco ---------- */
let FF='tutte',FQ='';
const statoF=(f,t=oggi())=>f.stato_doc=='bozza'?pill('Bozza'):f.stato_doc=='annullata'?pill('Annullata','no'):f.stato_pagamento=='pagata'?pill('Pagata','ok'):f.scadenza&&f.scadenza<t?pill('Scaduta','no'):f.stato_pagamento=='parziale'?pill('Parziale','wa'):pill('Da incassare','wa');
V.fatture=async()=>{const t=oggi(),fa=await q(sb.from('fatture').select('*,clienti(ragione_sociale)').order('data_emissione',{ascending:false}).order('creato_il',{ascending:false}));
 const filtra=()=>fa.filter(f=>{const k=FF;
  if(k=='bozze'&&f.stato_doc!='bozza')return false;if(k=='incassare'&&!(f.stato_doc=='emessa'&&res(f)>0))return false;
  if(k=='scadute'&&!(f.stato_doc=='emessa'&&res(f)>0&&f.scadenza&&f.scadenza<t))return false;if(k=='pagate'&&!(f.stato_doc=='emessa'&&f.stato_pagamento=='pagata'))return false;
  if(FQ){const s=((f.numero||'')+' '+(f.clienti?.ragione_sociale||'')).toLowerCase();if(!s.includes(FQ.toLowerCase()))return false}return true});
 $('#app').innerHTML=`<div class="row"><div><h1>Fatture</h1><p class="sub">Emesse e in bozza</p></div><div class="tb2" style="margin:0"><button class="btn t" id="ex">Esporta CSV</button><button class="btn" id="nf">Nuova fattura</button></div></div><div class="bar2" id="fb"><input id="qs" type="search" placeholder="Cerca numero o cliente" value="${esc(FQ)}" aria-label="Cerca"></div><div id="lt"></div>`;
 const dis=()=>{const L=filtra();$('#lt').innerHTML=tbl(['N°','Data','Cliente','Scadenza','>Totale','>Residuo','Stato',''],L.map(f=>`<tr><td><b>${f.numero?esc(f.numero)+'/'+f.anno:'—'}</b></td><td>${dd(f.data_emissione)}</td><td>${esc(f.clienti?.ragione_sociale||'—')}</td><td>${dd(f.scadenza)}</td><td class="n">${eur(f.totale)}</td><td class="n">${f.stato_doc=='emessa'?eur(res(f)):'—'}</td><td>${statoF(f,t)}</td><td class="n"><button class="btn t s" data-o="${f.id}" data-b="${f.stato_doc=='bozza'?1:0}">${f.stato_doc=='bozza'?'Modifica':'Apri'}</button></td></tr>`).join(''))+`<p class="sub">${L.length} fatture · totale ${eur(r2(L.filter(f=>f.stato_doc!='annullata').reduce((s,f)=>s+ +f.totale,0)))}</p>`;
  $$('[data-o]').forEach(b=>b.onclick=()=>run(()=>b.dataset.b=='1'?V.fe(b.dataset.o):V.fv(b.dataset.o)))};
 const ch=chips([['tutte','Tutte'],['bozze','Bozze'],['incassare','Da incassare'],['scadute','Scadute'],['pagate','Pagate']],FF,k=>{FF=k;$$('#fb .top button').forEach(b=>b.classList.toggle('on',b.dataset.c==k));dis()});
 $('#fb').prepend(ch);$('#qs').oninput=e=>{FQ=e.target.value;dis()};dis();
 $('#nf').onclick=()=>run(()=>V.fe());
 $('#ex').onclick=()=>csv('fatture.csv',[['Numero','Anno','Data','Cliente','Scadenza','Imponibile','IVA','Totale','Pagato','Stato documento','Stato pagamento'],...filtra().map(f=>[f.numero||'',f.anno||'',f.data_emissione,f.clienti?.ragione_sociale||'',f.scadenza||'',nm(f.imponibile),nm(f.iva_importo),nm(f.totale),nm(f.pagato),f.stato_doc,f.stato_pagamento])])};

/* ---------- Fatture: modello / editor ---------- */
let F=null,CL=[];
const NAT=[['N1','N1 · Esclusa art. 15'],['N2.1','N2.1 · Fuori campo IVA'],['N2.2','N2.2 · Non soggetta'],['N4','N4 · Esente']];
const gruppi=righe=>{const g={};righe.forEach(r=>{const a=+r.aliquota,n=a>0?'':(r.natura||'');const x=g[a+'|'+n]=g[a+'|'+n]||{a,n,i:0};x.i=r2(x.i+(r.imponibile!=null?+r.imponibile:r2(r.quantita*r.prezzo)))});return Object.values(g).map(x=>({...x,v:r2(x.i*x.a/100)})).sort((p,q)=>p.a-q.a)};
const calc=()=>{const G=gruppi(F.righe),imp=r2(G.reduce((s,x)=>s+x.i,0)),iva=r2(G.reduce((s,x)=>s+x.v,0));return{imp,iva,tot:r2(imp+iva),G}};
const totHtml=()=>{const c=calc();return c.G.map(g=>`<div class="mu"><span>IVA ${g.a}%${g.n?' ('+g.n+')':''} su ${eur(g.i)}</span><span>${eur(g.v)}</span></div>`).join('')+`<div><span>Imponibile</span><span>${eur(c.imp)}</span></div><div><span>IVA</span><span>${eur(c.iva)}</span></div><div class="gr"><span>Totale</span><span>${eur(c.tot)}</span></div>`};
V.fe=async(id,base)=>{CL=await q(sb.from('clienti').select('id,ragione_sociale').order('ragione_sociale'));
 const iva=S.iva_default!=null?+S.iva_default:22;
 if(id){const[f]=await q(sb.from('fatture').select('*').eq('id',id));if(!f)throw new Error('Fattura non trovata');if(f.stato_doc!='bozza')return V.fv(id);
  const r=await q(sb.from('fatture_righe').select('*').eq('fattura_id',id).order('ordine'));
  F={id,cliente_id:f.cliente_id||'',data_emissione:f.data_emissione,scadenza:f.scadenza||'',metodo_pagamento:f.metodo_pagamento||'',iban:f.iban||'',note:f.note||'',note_interne:f.note_interne||'',righe:r.map(x=>({descrizione:x.descrizione,quantita:+x.quantita,prezzo:+x.prezzo,aliquota:+x.aliquota,natura:x.natura||''})),bollo:!!f.bollo}}
 else{const t=oggi();F={id:null,cliente_id:'',data_emissione:t,scadenza:addG(t,S.giorni_scadenza||30),metodo_pagamento:'Bonifico bancario',iban:S.iban||'',note:'',note_interne:'',bollo:false,righe:[{descrizione:'',quantita:1,prezzo:0,aliquota:iva,natura:''}],...(base||{})}}
 drawFe()};
const righeHtml=()=>F.righe.map((r,i)=>`<tr><td><input data-i="${i}" data-k="descrizione" value="${esc(r.descrizione)}" placeholder="Descrizione prodotto o servizio" aria-label="Descrizione"></td><td style="width:90px"><input data-i="${i}" data-k="quantita" type="number" step="0.001" min="0" value="${r.quantita}" aria-label="Quantità"></td><td style="width:120px"><input data-i="${i}" data-k="prezzo" type="number" step="0.01" min="0" value="${r.prezzo}" aria-label="Prezzo unitario"></td><td style="width:90px"><input data-i="${i}" data-k="aliquota" type="number" step="0.01" min="0" value="${r.aliquota}" aria-label="IVA %"></td><td style="width:170px"><select data-i="${i}" data-k="natura" aria-label="Natura IVA" ${+r.aliquota>0?'disabled':''}><option value="">—</option>${NAT.map(n=>`<option value="${n[0]}" ${r.natura==n[0]?'selected':''}>${n[1]}</option>`).join('')}</select></td><td class="n" style="width:120px" id="ri${i}">${eur(r2(r.quantita*r.prezzo))}</td><td style="width:50px"><button type="button" class="btn r s" data-rm="${i}" aria-label="Rimuovi riga">×</button></td></tr>`).join('');
const salvaF=async()=>{const p={id:F.id||null,cliente_id:F.cliente_id||null,data_emissione:F.data_emissione,scadenza:F.scadenza||null,metodo_pagamento:F.metodo_pagamento||null,iban:F.iban||null,note:F.note||null,note_interne:F.note_interne||null,bollo:!!F.bollo,righe:F.righe.filter(r=>r.descrizione.trim()||r.prezzo).map(r=>({...r,natura:+r.aliquota==0?(r.natura||null):null}))};
 const{data,error}=await sb.rpc('salva_fattura',{p});if(error){toast(error.message);return null}F.id=data;return data};
const drawFe=()=>{
 $('#app').innerHTML=`<div class="row"><div><h1>${F.id?'Modifica bozza':'Nuova fattura'}</h1><p class="sub">Il numero viene assegnato solo quando emetti la fattura</p></div><button class="btn t" id="bk">← Elenco fatture</button></div>
<div class="card"><div class="fg"><div class="f2"><label for="fc">Cliente *</label><div class="row" style="flex-wrap:nowrap"><select id="fc" style="flex:1"><option value="">— scegli il cliente —</option>${CL.map(c=>`<option value="${c.id}">${esc(c.ragione_sociale)}</option>`).join('')}</select><button type="button" class="btn t s" id="nc">+ Nuovo</button></div></div>
<div><label for="fd">Data fattura</label><input type="date" id="fd"></div><div><label for="fs">Scadenza pagamento</label><input type="date" id="fs"></div>
<div><label for="fm">Metodo di pagamento</label><select id="fm">${['Bonifico bancario','Contanti','Carta','Assegno','Riba','Altro'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label for="fi">IBAN per il pagamento</label><input id="fi" maxlength="40"></div></div></div>
<h2>Prodotti e servizi</h2><div class="card tw"><table><thead><tr><th>Descrizione</th><th>Quantità</th><th>Prezzo</th><th>IVA %</th><th>Natura (se IVA 0%)</th><th class="n">Imponibile</th><th></th></tr></thead><tbody id="rg">${righeHtml()}</tbody></table><button type="button" class="btn t s" id="ar" style="margin-top:12px">+ Aggiungi riga</button></div>
<div class="card"><div class="tot" id="tt2">${totHtml()}</div><label style="display:flex;gap:10px;align-items:flex-start;font-weight:600;margin-top:16px"><input type="checkbox" id="fbo" style="width:auto;margin-top:3px"><span>Applica il bollo virtuale da 2 €<br><small class="mu" style="font-weight:500">Di norma obbligatorio sopra 77,47 € quando la fattura non ha IVA (esente, fuori campo, regime forfettario). Chiedi al commercialista nel dubbio.</small></span></label></div>
<div class="card"><label for="fn">Note per il cliente (compaiono in fattura)</label><textarea id="fn" rows="2" maxlength="1500"></textarea><label for="fx">Note interne (non compaiono in fattura)</label><textarea id="fx" rows="2" maxlength="1500"></textarea></div>
<div class="tb2"><button class="btn t" id="sv">Salva bozza</button><button class="btn" id="em">Emetti fattura</button>${F.id?'<button class="btn r" id="dl">Elimina bozza</button>':''}</div>`;

let AQ='',AC='';

 if(rows.length){const{data:su}=await sb.storage.from('contabilita').createSignedUrls(rows.map(d=>d.path),600);(su||[]).forEach(x=>urls[x.path]=x.signedUrl)}
 $('#app').innerHTML=`<h1>Archivio</h1><p class="sub">Documenti contabili, privati e visibili solo al personale contabile</p>
<div class="card"><div class="fg"><div class="f2"><label for="fa">File (PDF, immagine, XML, Excel o Word, massimo 20 MB)</label><input type="file" id="fa" accept=".pdf,.xml,.xlsx,.docx,image/jpeg,image/png"></div><div><label for="ac">Categoria</label><select id="ac">${CAT_A.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label for="aa">Anno</label><input id="aa" type="number" min="2000" max="2100" value="${new Date().getFullYear()}"></div><div class="f2"><label for="an">Nota (facoltativa)</label><input id="an" maxlength="300"></div></div><button class="btn" id="up">Carica nell'archivio</button></div>
<div class="bar2"><input id="qs" type="search" placeholder="Cerca per nome o nota" value="${esc(AQ)}" aria-label="Cerca"><select id="fc" aria-label="Categoria"><option value="">Tutte le categorie</option>${CAT_A.map(c=>`<option ${c==AC?'selected':''}>${c}</option>`).join('')}</select></div><div id="lt"></div>`;
 const dis=()=>{const s=AQ.toLowerCase(),L=rows.filter(d=>(!AC||d.categoria==AC)&&(!s||((d.nome||'')+' '+(d.note||'')).toLowerCase().includes(s)));
  $('#lt').innerHTML=tbl(['Documento','Categoria','Anno','Caricato il',''],L.map(d=>`<tr><td><b>${esc(d.nome)}</b><small>${esc(d.note||'')}</small></td><td>${esc(d.categoria||'—')}</td><td>${d.anno||'—'}</td><td>${dtt(d.creato_il)}</td><td class="n">${urls[d.path]?`<a class="btn t s" href="${esc(urls[d.path])}" target="_blank" rel="noopener">Apri</a> `:''}<button class="btn r s" data-x="${d.id}">Elimina</button></td></tr>`).join(''));
  $$('[data-x]').forEach(b=>b.onclick=async()=>{const d=rows.find(r=>r.id==b.dataset.x);if(!confirm('Eliminare "'+d.nome+'"?'))return;await sb.storage.from('contabilita').remove([d.path]);const{error}=await sb.from('archivio').delete().eq('id',d.id);toast(error?'Eliminazione non riuscita':'Documento eliminato');run(()=>V.archivio())})};
 $('#qs').oninput=e=>{AQ=e.target.value;dis()};$('#fc').onchange=e=>{AC=e.target.value;dis()};dis();
 $('#up').onclick=async()=>{const f=$('#fa').files[0];if(!f)return toast('Scegli un file');if(f.size>20971520)return toast('File troppo grande (massimo 20 MB)');
  const ext=(f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5),anno=parseInt($('#aa').value)||new Date().getFullYear(),path=P.azienda_id+'/'+anno+'/'+Date.now()+'.'+ext;
  $('#up').disabled=true;const{error}=await sb.storage.from('contabilita').upload(path,f,{contentType:f.type||undefined});
  if(error){$('#up').disabled=false;return toast('Caricamento non riuscito: formato non consentito o file troppo grande')}
  const{error:e2}=await sb.from('archivio').insert({nome:f.name,categoria:$('#ac').value,anno,path,dimensione:f.size,note:$('#an').value.trim()||null});
  if(e2){await sb.storage.from('contabilita').remove([path]);$('#up').disabled=false;return toast('Salvataggio non riuscito')}toast('Documento archiviato');run(()=>V.archivio())}};

/* ---------- Report ---------- */
let RY=new Date().getFullYear();
V.report=async()=>{const a=`${RY}-01-01`,b=`${RY}-12-31`;
 const[fa,us,pg]=await Promise.all([q(sb.from('fatture').select('*,clienti(ragione_sociale)').eq('stato_doc','emessa').gte('data_emissione',a).lte('data_emissione',b).order('data_emissione')),q(sb.from('uscite').select('*,fornitori(ragione_sociale)').gte('data',a).lte('data',b).order('data')),q(sb.from('pagamenti').select('*').gte('data',a).lte('data',b))]);
 const M=[...Array(12)].map(()=>({fi:0,fv:0,ui:0,uv:0,inc:0,pag:0}));
 fa.forEach(f=>{const m=+f.data_emissione.slice(5,7)-1;M[m].fi+=+f.imponibile;M[m].fv+=+f.iva_importo});
 us.forEach(u=>{const m=+u.data.slice(5,7)-1;M[m].ui+=+u.imponibile;M[m].uv+=+u.iva_importo});
 pg.forEach(p=>{const m=+p.data.slice(5,7)-1;M[m][p.tipo=='incasso'?'inc':'pag']+=+p.importo});
 const T=M.reduce((s,m)=>{for(const k in m)s[k]=(s[k]||0)+m[k];return s},{}),mese=i=>new Date(RY,i,1).toLocaleDateString('it-IT',{month:'long'});
 const Q=[0,1,2,3].map(i=>({v:M.slice(i*3,i*3+3).reduce((s,m)=>s+m.fv,0),a:M.slice(i*3,i*3+3).reduce((s,m)=>s+m.uv,0)}));
 const cl={};fa.forEach(f=>{const n=f.clienti?.ragione_sociale||'—';cl[n]=(cl[n]||0)+ +f.imponibile});const top=Object.entries(cl).sort((x,y)=>y[1]-x[1]).slice(0,5);
 $('#app').innerHTML=`<div class="row"><div><h1>Report ${RY}</h1><p class="sub">Calcolati sui documenti registrati (fatture emesse, spese, incassi e pagamenti)</p></div><div class="tb2" style="margin:0"><select id="yy" style="width:auto" aria-label="Anno">${[0,1,2,3,4].map(i=>new Date().getFullYear()-i).map(y=>`<option ${y==RY?'selected':''}>${y}</option>`).join('')}</select></div></div>
<div class="kp"><div class="card"><small>Fatturato (imponibile)</small><b>${eur(T.fi)}</b></div><div class="card"><small>Costi (imponibile)</small><b>${eur(T.ui)}</b></div><div class="card"><small>Margine lordo</small><b class="${T.fi-T.ui<0?'neg':''}">${eur(T.fi-T.ui)}</b></div><div class="card"><small>Flusso di cassa</small><b class="${T.inc-T.pag<0?'neg':''}">${eur(T.inc-T.pag)}</b></div></div>
<h2>Andamento mensile</h2>${tbl(['Mese','>Fatturato','>IVA vendite','>Acquisti','>IVA acquisti','>Incassi','>Pagamenti'],M.map((m,i)=>`<tr><td style="text-transform:capitalize">${mese(i)}</td><td class="n">${eur(m.fi)}</td><td class="n">${eur(m.fv)}</td><td class="n">${eur(m.ui)}</td><td class="n">${eur(m.uv)}</td><td class="n">${eur(m.inc)}</td><td class="n">${eur(m.pag)}</td></tr>`).join('')+`<tr><td><b>Totale</b></td><td class="n"><b>${eur(T.fi)}</b></td><td class="n"><b>${eur(T.fv)}</b></td><td class="n"><b>${eur(T.ui)}</b></td><td class="n"><b>${eur(T.uv)}</b></td><td class="n"><b>${eur(T.inc)}</b></td><td class="n"><b>${eur(T.pag)}</b></td></tr>`)}
<h2>IVA per trimestre</h2>${tbl(['Trimestre','>IVA vendite','>IVA acquisti','>Da versare / a credito'],Q.map((x,i)=>`<tr><td>${i+1}° trimestre</td><td class="n">${eur(x.v)}</td><td class="n">${eur(x.a)}</td><td class="n ${x.v-x.a<0?'neg':''}">${eur(x.v-x.a)}</td></tr>`).join(''))}
<p class="sub">Dati di supporto: la liquidazione IVA ufficiale va verificata con il commercialista.</p>
<h2>Migliori 5 clienti</h2>${tbl(['Cliente','>Fatturato'],top.map(x=>`<tr><td>${esc(x[0])}</td><td class="n">${eur(x[1])}</td></tr>`).join(''))}
<div class="tb2"><button class="btn t" id="e1">Esporta andamento mensile</button><button class="btn t" id="e2">Esporta registro vendite</button><button class="btn t" id="e3">Esporta registro acquisti</button></div>`;
 $('#yy').onchange=e=>{RY=+e.target.value;run(()=>V.report())};
 $('#e1').onclick=()=>csv('andamento-'+RY+'.csv',[['Mese','Fatturato','IVA vendite','Acquisti','IVA acquisti','Incassi','Pagamenti'],...M.map((m,i)=>[mese(i),nm(m.fi),nm(m.fv),nm(m.ui),nm(m.uv),nm(m.inc),nm(m.pag)])]);
 $('#e2').onclick=()=>csv('registro-vendite-'+RY+'.csv',[['Data','Numero','Cliente','Imponibile','IVA','Totale'],...fa.map(f=>[f.data_emissione,f.numero+'/'+f.anno,f.clienti?.ragione_sociale||'',nm(f.imponibile),nm(f.iva_importo),nm(f.totale)])]);
 $('#e3').onclick=()=>csv('registro-acquisti-'+RY+'.csv',[['Data','N° documento','Fornitore','Descrizione','Imponibile','IVA','Totale'],...us.map(u=>[u.data,u.numero_doc||'',u.fornitori?.ragione_sociale||'',u.descrizione,nm(u.imponibile),nm(u.iva_importo),nm(u.totale)])])};

/* ---------- Impostazioni ---------- */
V.impostazioni=async()=>{const{data:s}=await sb.from('azienda_fiscale').select('*').maybeSingle();S=s||{};
 const C=[['ragione_sociale','Ragione sociale',2],['partita_iva','Partita IVA'],['codice_fiscale','Codice fiscale'],['regime','Regime fiscale','select'],['indirizzo','Indirizzo',2],['cap','CAP'],['citta','Città'],['provincia','Provincia'],['email','Email'],['pec','PEC'],['telefono','Telefono'],['iban','IBAN per i pagamenti',2],['iva_default','Aliquota IVA predefinita %','number'],['giorni_scadenza','Giorni di scadenza predefiniti','number'],['prefisso_numero','Prefisso numero fattura (es. FT-, facoltativo)'],['piede_fattura','Testo a piè di fattura (condizioni, dicitura regime forfettario, ecc.)','textarea']];
 $('#app').innerHTML=`<h1>Impostazioni</h1><p class="sub">Dati fiscali che compaiono sulle fatture</p><form class="card" id="fm" novalidate><div class="fg">${C.map(c=>`<div class="${c[2]==2||c[2]=='textarea'?'f2':''}"><label for="s_${c[0]}">${esc(c[1])}</label>${c[2]=='select'?`<select id="s_${c[0]}"><option value="">—</option><option value="RF01">Ordinario (RF01)</option><option value="RF19">Forfettario (RF19)</option><option value="RF02">Contribuenti minimi (RF02)</option></select>`:c[2]=='textarea'?`<textarea id="s_${c[0]}" rows="3"></textarea>`:`<input id="s_${c[0]}" type="${c[2]=='number'?'number':'text'}" ${c[2]=='number'?'step="0.01" min="0"':''}>`}</div>`).join('')}</div><p class="msg" id="se"></p><button class="btn" type="submit" style="margin-top:0">Salva impostazioni</button></form>
<p class="sub">Ragione sociale e partita IVA sono obbligatorie per emettere fatture. I numeri progressivi sono assegnati dal sistema, senza buchi, per anno.</p>`;
 C.forEach(c=>{$('#s_'+c[0]).value=S[c[0]]??(c[0]=='iva_default'?22:c[0]=='giorni_scadenza'?30:'')});$('#s_regime').value=regimeCod(S.regime)||'';
 $('#fm').onsubmit=async e=>{e.preventDefault();const o={azienda_id:P.azienda_id};C.forEach(c=>{const v=$('#s_'+c[0]).value.trim();o[c[0]]=c[2]=='number'?fl(v):(v||null)});
  if(o.partita_iva&&!/^\d{11}$/.test(o.partita_iva))return $('#se').textContent='La partita IVA deve avere 11 cifre';
  o.prefisso_numero=o.prefisso_numero||'';
  const{error}=await sb.from('azienda_fiscale').upsert(o,{onConflict:'azienda_id'});if(error)return $('#se').textContent='Salvataggio non riuscito';$('#se').textContent='';S=o;toast('Impostazioni salvate')}};

/* ---------- Menu ---------- */
const GR=[['Panoramica',[['cruscotto','Cruscotto']]],['Vendite',[['fatture','Fatture'],['clienti','Clienti'],['entrate','Entrate']]],['Acquisti',[['uscite','Uscite'],['fornitori','Fornitori'],['pagamenti','Pagamenti']]],['Tesoreria',[['disponibilita','Disponibilità'],['scadenze','Scadenze']]],['Archivio e report',[['archivio','Archivio'],['report','Report']]],['Altro',[['impostazioni','Impostazioni']]]];
const menuHtml=()=>{const cur=GR.flatMap(g=>g[1]).find(x=>x[0]==tab);
 return `<div class="tb"><button class="mb" data-menu="1" aria-label="Apri il menu"><span></span><span></span><span></span></button><b>${cur?cur[1]:''}</b></div><div class="ov"></div><aside class="dr" aria-label="Menu"><div class="dh"><img src="icon-192.png" alt="" width="36" height="36"><b>Contabilità</b></div>${GR.map(g=>`<small>${g[0]}</small>${g[1].map(x=>`<button class="${x[0]==tab?'on':''}" data-t="${x[0]}">${x[1]}</button>`).join('')}`).join('')}<button class="lo" data-home="1" style="margin-top:auto;color:var(--ink)">← Torna all'app</button><button class="lo" data-lo="1" style="margin-top:0">Esci</button></aside>`};
document.addEventListener('click',async e=>{const n=$('#nav');if(!n)return;
 if(e.target.closest('[data-menu]'))n.classList.toggle('open');
 const t=e.target.closest('[data-t]');if(t){n.classList.remove('open');go(t.dataset.t)}else if(e.target.closest('.ov'))n.classList.remove('open');
 if(e.target.closest('[data-home]'))location.href='index.html';
 if(e.target.closest('[data-lo]')){await sb.auth.signOut();location.replace('index.html')}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&$('#nav'))$('#nav').classList.remove('open')});
boot();
</script><script>
(function(){var h=document.documentElement,b=document.createElement("button");b.id="tg";b.type="button";
var S='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">',
 luna=S+'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
 sole=S+'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function draw(){var n=h.getAttribute("data-theme")=="notte";b.innerHTML=n?luna:sole;b.setAttribute("aria-label",n?"Modalità notte attiva: passa alla modalità giorno":"Modalità giorno attiva: passa alla modalità notte");b.title=n?"Passa alla modalità giorno":"Passa alla modalità notte";var m=document.querySelector("meta[name=theme-color]");if(m)m.setAttribute("content",n?"#1c3556":"#f6efe0")}
b.onclick=function(){var n=h.getAttribute("data-theme")=="notte"?"giorno":"notte";h.setAttribute("data-theme",n);try{localStorage.setItem("pmw-tema",n)}catch(e){}draw()};
draw();document.body.appendChild(b)})();
</script></body></html>
