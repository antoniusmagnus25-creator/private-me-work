<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Private Me Work · Dashboard HR</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#033155">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>const CFG={url:'https://xdzwnwkwdzadkwnvzxkl.supabase.co',key:'sb_publishable_k9td9Qw0_Tc1wNeLc197XA_DjlFOAT3'};</script>
</head><body>
<main class="wrap w" id="app"></main><div id="tt" role="status" style="bottom:28px"></div>
<script>
const sb=supabase.createClient(CFG.url,CFG.key),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const ST={attesa:['wa','In attesa'],ok:['ok','Approvata'],no:['no','Rifiutata']};
const bg=s=>`<span class="bg ${ST[s][0]}">${ST[s][1]}</span>`;
const dt=s=>new Date(s).toLocaleString('it-IT',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const toast=m=>{const t=$('#tt');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)};
let P=null,tab='ric';

const login=(m='')=>{$('#app').innerHTML=`<div style="max-width:380px;margin:40px auto"><img class="lg" src="logo-work.png" alt="Private Me Work" width="150" height="150"><p class="sub">Dashboard Risorse Umane</p><label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><p class="msg">${m}</p><button class="btn" id="go">Accedi</button></div>`;
 const go=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});error?login('Email o password non corrette'):boot()};
 $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key=='Enter')go()}};
const out=async()=>{await sb.auth.signOut();login()};
const boot=async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)return login();
 const{data}=await sb.from('profili').select('*').eq('id',session.user.id).maybeSingle();
 if(!data||!['hr','admin'].includes(data.ruolo_app)){$('#app').innerHTML='<h1>Accesso riservato</h1><p class="sub">Questa area è dedicata alle Risorse Umane.</p><button class="btn" id="lo">Esci</button>';$('#lo').onclick=out;return}
 P=data;if(session.user.user_metadata?.cambia_password)return pwScreen(show);show()};
const show=()=>{const T=[['ric','Richieste'],['avv','Avvisi'],['acc','Accessi'],['dip','Dipendenti'],['tor','Tornello (prova)']];
 $('#app').innerHTML=`<div class="row"><h1>${esc(P.nome)} <span>· HR</span></h1><button class="btn t s" id="lo">Esci</button></div><div class="top">${T.map(t=>`<button class="${t[0]==tab?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div><section id="v"></section>`;$('#lo').onclick=out;V[tab]()};
const tbl=(h,r)=>`<div class="card tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r||`<tr><td colspan="${h.length}" class="sub">Nessun dato.</td></tr>`}</tbody></table></div>`;
const V={
ric:async()=>{const{data}=await sb.from('richieste').select('*,profili(nome)').order('creata_il',{ascending:false});
 $('#v').innerHTML=tbl(['Dipendente','Richiesta','Periodo','Stato',''],(data||[]).map(r=>`<tr><td><b>${esc(r.profili?.nome)}</b></td><td>${esc(r.tipo)}${r.protocollo?`<small>Protocollo ${esc(r.protocollo)}</small>`:''}${r.nota?`<small>${esc(r.nota)}</small>`:''}</td><td>${esc(r.dal)} → ${esc(r.al)}</td><td>${bg(r.stato)}</td><td>${r.stato=='attesa'?`<button class="btn r s" data-d="${r.id}:no">Rifiuta</button> <button class="btn s" style="margin:0" data-d="${r.id}:ok">Approva</button>`:''}</td></tr>`).join(''))},
avv:async()=>{const{data}=await sb.from('avvisi').select('*,letture_avvisi(count)').order('creato_il',{ascending:false});
 $('#v').innerHTML=`<div class="card"><h2 style="margin-top:0">Nuovo avviso</h2><label for="at">Titolo</label><input id="at"><label for="ax">Testo</label><textarea id="ax" rows="3"></textarea><label class="row" style="justify-content:flex-start"><input type="checkbox" id="ai" style="width:auto"> Importante</label><button class="btn" id="pb">Pubblica avviso</button></div>`+tbl(['Avviso','Pubblicato','Letto da'],(data||[]).map(v=>`<tr><td>${v.importante?'<span class="bg no">Importante</span> ':''}<b>${esc(v.titolo)}</b><small>${esc(v.testo)}</small></td><td>${dt(v.creato_il)}</td><td>${v.letture_avvisi?.[0]?.count??0}</td></tr>`).join(''));
 $('#pb').onclick=async()=>{const titolo=$('#at').value.trim(),testo=$('#ax').value.trim();if(!titolo||!testo)return toast('Scrivi titolo e testo');
  const{error}=await sb.from('avvisi').insert({azienda_id:P.azienda_id,titolo,testo,importante:$('#ai').checked});toast(error?'Pubblicazione non riuscita':'Avviso pubblicato');V.avv()}},
acc:async()=>{const{data}=await sb.from('accessi').select('*,profili(nome)').order('creato_il',{ascending:false}).limit(50);
 $('#v').innerHTML=tbl(['Quando','Dipendente','Varco','Esito'],(data||[]).map(a=>`<tr><td>${dt(a.creato_il)}</td><td><b>${esc(a.profili?.nome)}</b></td><td>${esc(a.varco)}</td><td><span class="bg ${a.esito}">${a.esito=='ok'?'Consentito':'Negato'}</span>${a.motivo?`<small>${esc(a.motivo)}</small>`:''}</td></tr>`).join(''))},
dip:async()=>{const{data}=await sb.from('profili').select('*').order('nome');const oggi=new Date().toISOString().slice(0,10);
 $('#v').innerHTML=tbl(['Dipendente','Ruolo','Sede','Formazione sicurezza'],(data||[]).map(p=>`<tr><td><b>${esc(p.nome)}</b><small>Matricola ${esc(p.matricola||'—')}</small></td><td>${esc(p.ruolo_lavoro||'—')}</td><td>${esc(p.sede||'—')}</td><td>${p.formazione_scadenza?`<span class="bg ${p.formazione_scadenza<oggi?'no':'ok'}">${p.formazione_scadenza<oggi?'Scaduta':'Valida'} · ${esc(p.formazione_scadenza)}</span>`:'—'}</td></tr>`).join(''))},
tor:()=>{$('#v').innerHTML=`<div class="card" style="max-width:520px"><h2 style="margin-top:0">Simulatore tornello</h2><p class="sub">Copia il codice mostrato sotto il QR nell'app del dipendente e incollalo qui. Vale 40 secondi.</p><label for="tk">Codice badge</label><input id="tk"><label for="vr">Varco</label><select id="vr"><option>Ingresso principale</option><option>Magazzino</option><option>Uffici</option></select><button class="btn" id="vf">Verifica accesso</button><div id="es" style="margin-top:16px"></div></div>`;
 $('#vf').onclick=async()=>{const{data,error}=await sb.rpc('verifica_badge',{p_token:$('#tk').value.trim(),p_varco:$('#vr').value});
  $('#es').innerHTML=error?'<span class="bg no">Errore, riprova</span>':`<span class="bg ${data.esito}" style="font-size:16px;padding:8px 18px">${data.esito=='ok'?'Accesso consentito':'Accesso negato'}</span><p class="sub">${esc(data.nome||'')} ${esc(data.motivo||'')}</p>`;$('#tk').value=''}}};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-t]'),d=e.target.closest('[data-d]');
 if(t){tab=t.dataset.t;show()}
 if(d){const[id,stato]=d.dataset.d.split(':');const{error}=await sb.from('richieste').update({stato}).eq('id',id);toast(error?'Operazione non riuscita':stato=='ok'?'Richiesta approvata':'Richiesta rifiutata');V.ric()}});
const pwScreen=next=>{if($('#nav'))$('#nav').innerHTML='';$('#app').innerHTML=`<div class="login"><h1>Scegli la tua password</h1><p class="sub">Primo accesso: imposta una password personale (almeno 8 caratteri).</p><label for="n1">Nuova password</label><input id="n1" type="password" autocomplete="new-password"><label for="n2">Ripeti la password</label><input id="n2" type="password" autocomplete="new-password"><p class="msg" id="pe"></p><button class="btn" id="ps">Salva e continua</button></div>`;
 $('#ps').onclick=async()=>{const a=$('#n1').value;if(a.length<8)return $('#pe').textContent='Almeno 8 caratteri';if(a!==$('#n2').value)return $('#pe').textContent='Le password non coincidono';const{error}=await sb.auth.updateUser({password:a,data:{cambia_password:false}});if(error)return $('#pe').textContent='Non riesco a salvare: '+error.message;next()}};

V.dip=async()=>{const{data}=await sb.from('profili').select('*').order('nome');const oggi=new Date().toISOString().slice(0,10);
 $('#v').innerHTML=`<div class="card"><h2 style="margin-top:0">Aggiungi dipendenti</h2><p class="sub">Una riga per persona, separata da punto e virgola: <b>nome; email; ruolo; sede; matricola; scadenza formazione (AAAA-MM-GG)</b>. Solo nome ed email sono obbligatori.</p><textarea id="ls" rows="4" placeholder="Giulia Bianchi; giulia@azienda.it; Cassiera; Milano Centro; 00301; 2026-11-18"></textarea><button class="btn" id="ad">Crea account</button><div id="rs"></div></div>`+tbl(['Dipendente','Ruolo e sede','Formazione','Stato',''],(data||[]).map(p=>`<tr><td><b>${esc(p.nome)}</b><small>${esc(p.email||'')}</small></td><td>${esc(p.ruolo_lavoro||'—')}<small>${esc(p.sede||'')}</small></td><td>${p.formazione_scadenza?`<span class="bg ${p.formazione_scadenza<oggi?'no':'ok'}">${p.formazione_scadenza<oggi?'Scaduta':'Valida'} · ${esc(p.formazione_scadenza)}</span>`:'—'}</td><td><span class="bg ${p.attivo?'ok':'wa'}">${p.attivo?'Attivo':'Disattivato'}</span></td><td>${p.id==P.id?'':`<button class="btn t s" data-pw="${p.id}">Nuova password</button> <button class="btn ${p.attivo?'r':'t'} s" data-at="${p.id}:${p.attivo?0:1}">${p.attivo?'Disattiva':'Riattiva'}</button>`}</td></tr>`).join(''));
 $('#ad').onclick=async()=>{const dip=$('#ls').value.split('\n').map(r=>r.split(';').map(x=>x.trim())).filter(r=>r[0]||r[1]).map(r=>({nome:r[0],email:r[1],ruolo_lavoro:r[2],sede:r[3],matricola:r[4],formazione_scadenza:r[5]}));if(!dip.length)return toast('Incolla almeno una riga');
  $('#ad').disabled=true;const{data,error}=await sb.functions.invoke('admin-api',{body:{azione:'crea_dipendenti',dipendenti:dip}});$('#ad').disabled=false;
  if(error||!data?.risultati)return toast('Operazione non riuscita: controlla la funzione su Supabase');
  window.CRED=data.risultati.filter(r=>r.password).map(r=>r.nome+' · '+r.email+' · '+r.password).join('\n');
  $('#rs').innerHTML=`<table style="margin-top:14px"><tbody>${data.risultati.map(r=>`<tr><td>${esc(r.email)}</td><td>${r.password?`<code>${esc(r.password)}</code>`:`<span class="bg no">${esc(r.errore)}</span>`}</td></tr>`).join('')}</tbody></table><p class="sub">Password temporanee: ogni persona dovrà sceglierne una nuova al primo accesso. Salvale ora, non saranno più visibili.</p><button class="btn t" id="cp">Copia elenco</button>`}};
document.addEventListener('click',async e=>{const w=e.target.closest('[data-pw]'),a=e.target.closest('[data-at]');
 if(e.target.id=='cp'){try{await navigator.clipboard.writeText(window.CRED||'');toast('Elenco copiato')}catch(_){toast('Copia non riuscita: selezionalo a mano')}}
 if(w){if(!confirm('Generare una nuova password temporanea per questa persona?'))return;const{data,error}=await sb.functions.invoke('admin-api',{body:{azione:'reset_password',profilo_id:w.dataset.pw}});alert(error||!data?.password?'Operazione non riuscita':'Nuova password temporanea: '+data.password+'\nLa persona dovrà cambiarla al primo accesso.')}
 if(a){const[id,v]=a.dataset.at.split(':');const{error}=await sb.from('profili').update({attivo:v=='1'}).eq('id',id);toast(error?'Operazione non riuscita':v=='1'?'Account riattivato':'Account disattivato');V.dip()}});
boot();
</script></body></html>
