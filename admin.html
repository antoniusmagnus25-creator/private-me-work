<!doctype html>
<html lang="it"><head><meta charset="utf-8"><script>try{var _t=localStorage.getItem("pmw-tema");if(_t!="giorno"&&_t!="notte")_t=matchMedia("(prefers-color-scheme: dark)").matches?"notte":"giorno";document.documentElement.setAttribute("data-theme",_t)}catch(e){document.documentElement.setAttribute("data-theme","giorno")}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Private Me Work · Pannello proprietario</title>
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>const CFG={url:'https://xdzwnwkwdzadkwnvzxkl.supabase.co',key:'sb_publishable_k9td9Qw0_Tc1wNeLc197XA_DjlFOAT3'};</script>
</head><body>
<main class="wrap" id="app"></main><div id="tt" role="status" style="bottom:28px"></div>
<script>
const sb=supabase.createClient(CFG.url,CFG.key),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const toast=m=>{const t=$('#tt');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)};
const out=async()=>{await sb.auth.signOut();login()};
const login=(m='')=>{$('#app').innerHTML=`<div class="login"><img class="lg" src="logo-work.png" alt="Private Me Work" width="150" height="150"><p class="sub">Pannello proprietario</p><label for="em">Email</label><input id="em" type="email" autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><p class="msg">${m}</p><button class="btn" id="go">Accedi</button></div>`;
 const go=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});error?login('Email o password non corrette'):boot()};
 $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key=='Enter')go()}};
const boot=async()=>{const{data:{session}}=await sb.auth.getSession();if(!session)return login();
 const{data,error}=await sb.functions.invoke('admin-api',{body:{azione:'elenco_aziende'}});
 if(error||!data?.aziende){$('#app').innerHTML='<h1>Accesso riservato</h1><p class="sub">Questo pannello è dedicato al proprietario della piattaforma (oppure la funzione admin-api non è ancora attiva).</p><button class="btn" id="lo">Esci</button>';$('#lo').onclick=out;return}
 show(data.aziende)};
const show=az=>{$('#app').innerHTML=`<div class="row"><h1>Aziende clienti</h1><button class="btn t s" id="lo">Esci</button></div><p class="sub">Crea l'azienda e il suo primo account Risorse Umane. Poi sarà l'HR ad aggiungere i dipendenti dalla propria dashboard.</p>
<div class="card"><h2 style="margin-top:0">Nuova azienda</h2><label for="an">Nome azienda</label><input id="an"><label for="hn">Referente HR (nome e cognome)</label><input id="hn"><label for="he">Email del referente HR</label><input id="he" type="email"><button class="btn" id="cr">Crea azienda</button><div id="rs"></div></div>
<h2>Aziende attive (${az.length})</h2>${az.map(a=>`<div class="card row"><b>${esc(a.nome)}</b><span class="bg ok">${a.profili?.[0]?.count??0} persone</span></div>`).join('')||'<p class="sub">Nessuna azienda.</p>'}`;
 $('#lo').onclick=out;
 $('#cr').onclick=async()=>{const body={azione:'crea_azienda',nome:$('#an').value,hr_nome:$('#hn').value,hr_email:$('#he').value};if(!body.nome.trim()||!body.hr_nome.trim()||!body.hr_email.trim())return toast('Compila tutti i campi');
  $('#cr').disabled=true;const{data,error}=await sb.functions.invoke('admin-api',{body});$('#cr').disabled=false;
  if(error||!data?.invitato)return toast('Creazione non riuscita: controlla i dati, che l\'email non sia già usata e che l\'invio email sia attivo');
  $('#rs').innerHTML=`<div class="card" style="background:var(--tint);margin-top:16px"><b>${esc(data.azienda)}</b> creata.<p class="sub" style="margin:8px 0">Ho inviato un'email di invito a <b>${esc(data.email)}</b>: il referente HR potrà scegliere la password e poi entrare da app.privateme.work/hr.html.</p></div>`;
  const{data:d2}=await sb.functions.invoke('admin-api',{body:{azione:'elenco_aziende'}});if(d2?.aziende){const c=$('#rs').innerHTML;show(d2.aziende);$('#rs').innerHTML=c}}};
boot();
</script><script>
(function(){var h=document.documentElement,b=document.createElement("button");b.id="tg";b.type="button";
var S='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">',
 luna=S+'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
 sole=S+'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function draw(){var n=h.getAttribute("data-theme")=="notte";b.innerHTML=n?luna:sole;b.setAttribute("aria-label",n?"Modalità notte attiva: passa alla modalità giorno":"Modalità giorno attiva: passa alla modalità notte");b.title=n?"Passa alla modalità giorno":"Passa alla modalità notte";var m=document.querySelector("meta[name=theme-color]");if(m)m.setAttribute("content",n?"#1c3556":"#f6efe0")}
b.onclick=function(){var n=h.getAttribute("data-theme")=="notte"?"giorno":"notte";h.setAttribute("data-theme",n);try{localStorage.setItem("pmw-tema",n)}catch(e){}draw()};
draw();document.body.appendChild(b)})();
</script></body></html>
